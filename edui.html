<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EdUI — Edytor Studio</title>
  <meta name="description" content="EdUI">
  <link rel="icon" href="icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="edui-page">
    <a class="btn" href="index.html" data-back>← Edytor Studio</a>
    <section class="edui-message" aria-labelledby="edui-title">
      <h1 id="edui-title">EdUI</h1>
      <p id="edui-status"></p>
    </section>
  </main>
  <script>
    (function () {
      var messages = {
        en: 'In development',
        uk: 'В розробці',
        ru: 'В разработке',
        de: 'In Entwicklung',
        es: 'En desarrollo',
        pl: 'W rozwoju'
      };
      var lang = 'en';
      try {
        var saved = localStorage.getItem('lang');
        if (saved && messages[saved]) lang = saved;
        else {
          lang = (navigator.language || 'en').slice(0, 2).toLowerCase();
          if (lang === 'ua') lang = 'uk';
          if (!messages[lang]) lang = 'en';
        }
      } catch (e) {}
      document.documentElement.lang = lang;
      document.getElementById('edui-status').textContent = messages[lang];
    })();
  </script>
</body>
</html>
